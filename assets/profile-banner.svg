<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="45%" stop-color="#241654"/>
      <stop offset="100%" stop-color="#1b1035"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="offset" values="0;0.3;0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#a855f7">
        <animate attributeName="offset" values="0.55;0.85;0.55" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.35;0.55;0.35" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="starGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- twinkling skyline stars, echoing the avatar's city lights -->
  <g>
    <g>
      <circle cx="80" cy="60" r="4.5" fill="#7dd3fc" opacity="0.5" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="2.6s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="80" cy="60" r="1.8" fill="#ffffff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" begin="0s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="140" cy="40" r="3.5" fill="#7dd3fc" opacity="0.5" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.1s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="140" cy="40" r="1.4" fill="#ffffff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="200" cy="70" r="4.5" fill="#7dd3fc" opacity="0.5" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="2.3s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="200" cy="70" r="1.8" fill="#ffffff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.3s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="1020" cy="50" r="4.5" fill="#7dd3fc" opacity="0.5" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="2.8s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1020" cy="50" r="1.8" fill="#ffffff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="1080" cy="75" r="3.5" fill="#7dd3fc" opacity="0.5" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1080" cy="75" r="1.4" fill="#ffffff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="1140" cy="45" r="4.5" fill="#7dd3fc" opacity="0.5" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="2.5s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1140" cy="45" r="1.8" fill="#ffffff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" begin="1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="960" cy="90" r="3.5" fill="#7dd3fc" opacity="0.5" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="3s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="960" cy="90" r="1.4" fill="#ffffff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="60" cy="100" r="3.5" fill="#7dd3fc" opacity="0.5" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="2.9s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="100" r="1.4" fill="#ffffff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- animated circuit-style lines, mirrored and aligned, flowing light for a tech feel -->
  <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <path d="M0 240 H260 L300 210 H420" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M1200 240 H940 L900 210 H780" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- glow duplicate of title for a neon pulsing effect -->
  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="58" font-weight="700" fill="#a855f7" filter="url(#blur)" opacity="0.6">
    FATMA GAMAL
    <animate attributeName="opacity" values="0.45;0.75;0.45" dur="3.5s" repeatCount="indefinite"/>
  </text>

  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="58" font-weight="700" fill="url(#titleGrad)">
    FATMA GAMAL
  </text>

  <text x="600" y="195" text-anchor="middle" font-family="Consolas, Menlo, monospace"
        font-size="19" fill="#c4b5fd">
    Frontend Developer  •  Angular &amp; React  •  Full-Stack with Node.js
  </text>

  <text x="600" y="230" text-anchor="middle" font-family="Consolas, Menlo, monospace"
        font-size="14" fill="#7dd3fc" opacity="0.85">
    turning designs into fast, clean, real-time web experiences
  </text>
</svg>
